[package]
name = "vytty-core"
description = "Vytty's terminal backends, session store, vault, importers and updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
futures-util = "0.3"
gethostname = "1"
notify = { version = "9", default-features = false }
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa", "des", "dsa"] }
russh-sftp = "4"
serialport = { version = "4", default-features = false }
tokio = { version = "1", features = ["full"] }
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
percent-encoding = "2"
regex = "1"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"

url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
