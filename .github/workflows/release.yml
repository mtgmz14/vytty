name: Build & release

# Every push and pull request: the Rust tests (backends against test SSH /
# Telnet servers, importers, vault compatibility, updater), the UI tests and a
# headless end-to-end run of the real app. Tags v* (and manual runs): Windows
# and Linux release builds, each started once as a smoke test. Tags v* also
# get signed checksums for the in-app updater, build provenance attestations
# and the GitHub release.
#
# Optional code signing (see docs/PODPISYWANIE.md) - nothing to configure for
# unsigned builds:
#   SignPath.io (free for open source): variables SIGNPATH_ORGANIZATION_ID,
#     SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG; secret SIGNPATH_API_TOKEN
#   a .pfx certificate: secrets WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#   Azure Artifact Signing: variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#     AZURE_SIGNING_PROFILE; secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
# Update signing: by default the key is kept offline. The release then stays a
# draft until `node scripts/sign-release.js <tag>`, run where the key is kept,
# has checked the files and their provenance, signed SHA256SUMS.txt and
# published it. With the secret VYTTY_UPDATE_SIGNING_KEY the workflow signs and
# publishes on its own.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Libraries for the Linux window (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev xvfb xauth imagemagick openssh-server
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: UI and release tooling tests
        run: npm test
      - run: node scripts/build-ui.js
      - name: Rust tests (with a real OpenSSH server for the interoperability tests)
        env:
          VYTTY_TEST_SSHD: /usr/sbin/sshd
        run: cargo test --workspace --locked
      - name: End-to-end test (the real app on a virtual display)
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
        run: |
          cargo build -p vytty --locked
          xvfb-run -a -s "-screen 0 1360x860x24" node test/e2e/run.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: test/e2e/out
          if-no-files-found: ignore

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: node scripts/build-ui.js
      - name: Build Vytty.exe
        run: cargo build --release -p vytty --locked
      - name: Stage Vytty.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\win-unpacked | Out-Null
          Copy-Item target\release\vytty.exe dist\win-unpacked\Vytty.exe -Force

      # A .pfx certificate or Azure Artifact Signing (no-op when not configured).
      - name: Sign Vytty.exe (certificate file / Azure)
        run: node scripts/sign-win.js dist/win-unpacked/Vytty.exe

      # SignPath.io (free code signing for open source).
      - name: Upload Vytty.exe for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: dist/win-unpacked/Vytty.exe
      - name: Sign Vytty.exe (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: vytty-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Use the signed Vytty.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: Copy-Item signed-exe\Vytty.exe dist\win-unpacked\Vytty.exe -Force

      - name: Package (portable .exe + zip)
        run: node scripts/package-win.js dist/win-unpacked/Vytty.exe

      - name: Smoke test (the app starts, loads its UI and exits)
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = (Get-Item "dist\Vytty-$version-portable.exe").FullName
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed (exit $($p.ExitCode))" }
          if (Test-Path "$env:LOCALAPPDATA\Vytty\app") { throw 'unexpected files in %LOCALAPPDATA%\Vytty\app' }
          Get-AuthenticodeSignature $exe | Format-Table Status, SignerCertificate, Path -AutoSize
          Get-Item $exe | Select-Object Name, Length, @{ n = 'Version'; e = { $_.VersionInfo.ProductVersion } } | Format-Table -AutoSize

      - uses: actions/upload-artifact@v7
        with:
          name: vytty-windows
          path: |
            dist/Vytty-*-win-x64.zip
            dist/Vytty-*-portable.exe
          if-no-files-found: error

  # The real app on Windows (WebView2, ConPTY, the SSH client) driven by the
  # end-to-end test; a debug build, because the test mode is compiled only there.
  e2e-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: node scripts/build-ui.js
      - run: cargo build -p vytty --locked
      - name: End-to-end test
        run: node test/e2e/run.js

  linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # The oldest supported Ubuntu: the AppImage then runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Libraries for the Linux window (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev file xvfb xauth
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npx tauri build --bundles appimage -- --locked
          version=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp target/release/bundle/appimage/*.AppImage "dist/Vytty-$version.AppImage"
          chmod +x dist/*.AppImage
          ls -la dist
      - name: Smoke test
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
        run: xvfb-run -a dist/Vytty-*.AppImage --appimage-extract-and-run --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: vytty-linux
          path: dist/Vytty-*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, e2e-windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: vytty-*
          path: release
          merge-multiple: true
      - name: Checksums and update signature
        id: sums
        env:
          VYTTY_UPDATE_SIGNING_KEY: ${{ secrets.VYTTY_UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$VYTTY_UPDATE_SIGNING_KEY" ]; then
            node scripts/checksums.js release --require-signature
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/checksums.js release
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build provenance (gh attestation verify <file> --repo ${{ github.repository }})
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/Vytty-*
      - name: Publish the release (a draft while the update key is offline)
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sums.outputs.signed }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.js "$version" > notes.md
          if [ "$SIGNED" = true ]; then
            gh release create "$GITHUB_REF_NAME" release/* --title "Vytty $version" --notes-file notes.md --verify-tag
            exit 0
          fi
          # Not visible to users or to the in-app updater until it is published.
          gh release create "$GITHUB_REF_NAME" release/* --title "Vytty $version" --notes-file notes.md --verify-tag --draft
          echo "::notice title=Draft release::Sign and publish it where the update key is kept: node scripts/sign-release.js $GITHUB_REF_NAME"
          {
            echo '### Draft release, waiting for the update signature'
            echo
            echo 'The update signing key is kept offline. On the computer that holds it run:'
            echo
            echo '```'
            echo "node scripts/sign-release.js $GITHUB_REF_NAME"
            echo '```'
            echo
            echo 'It checks every file against SHA256SUMS.txt and its build provenance, signs the list and publishes the release.'
          } >> "$GITHUB_STEP_SUMMARY"
